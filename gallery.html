[[-7,-7,0xffcfe6],[7,-7,0xcfe8ff],[-7,7,0xd6ffdc],[7,7,0xfff0c0]].forEach(([x,z,col])=>{const p=new THREE.PointLight(col,0.5,34);p.position.set(x,6,z);scene.add(p);});
const W=22,D=22,H=8, MZ=3.4;   // room + mezzanine height
const floor=new THREE.Mesh(new THREE.PlaneGeometry(W,D),new THREE.MeshStandardMaterial({color:0xf7ecff,roughness:.95})); floor.rotation.x=-Math.PI/2; scene.add(floor);

wall(W,H,0,H/2,-D/2,0); wall(W,H,0,H/2,D/2,Math.PI); wall(D,H,-W/2,H/2,0,Math.PI/2); wall(D,H,W/2,H/2,0,-Math.PI/2);
const ceil=new THREE.Mesh(new THREE.PlaneGeometry(W,D),new THREE.MeshStandardMaterial({color:0xfffdf6})); ceil.rotation.x=Math.PI/2; ceil.position.y=H; scene.add(ceil);

/* rainbow wall (right) */

(function starLights(){ const c=document.createElement('canvas'); c.width=c.height=64; const x=c.getContext('2d'); x.translate(32,32); x.fillStyle='#fff'; x.shadowColor='#fff'; x.shadowBlur=12; x.beginPath();

  run(4,-W/2+inset,-D/2+near,W/2-inset,-D/2+near,0,yG);

function placeArtwork(item){ return new Promise(res=>{ const idx=placedTotal; const slot=slots[placedTotal%slots.length]; placedTotal++;
  const img=new Image(); img.onload=()=>{ const ar=img.width/img.height; let w=2.4,h=2.4; if(ar>1)h=w/ar; else w=h*ar;
    const tex=new THREE.Texture(img); tex.colorSpace=THREE.SRGBColorSpace; tex.needsUpdate=true; const grp=new THREE.Group();
    grp.add(new THREE.Mesh(new THREE.BoxGeometry(w+0.36,h+0.36,0.12),new THREE.MeshStandardMaterial({color:frameCols[idx%frameCols.length],roughness:.5,metalness:.2})));
    const mat=new THREE.Mesh(new THREE.PlaneGeometry(w+0.12,h+0.12),new THREE.MeshStandardMaterial({color:0xffffff})); mat.position.z=0.062; grp.add(mat);
    const art=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tex})); art.position.z=0.07; art.userData.key=item.key; grp.add(art);
    grp.position.set(slot.x,slot.y,slot.z); grp.rotation.y=slot.ry; scene.add(grp); shown.set(item.key,{item,group:grp,artMesh:art}); res(); };
  img.onerror=()=>res(); img.src=item.img; }); }
async function syncItems(items){ const seen=new Set();
  for(const it of items){ seen.add(it.key); if(shown.has(it.key)){ const e=shown.get(it.key); Object.assign(e.item,it); if(cur&&cur.key===it.key){cur=e.item; refreshModal();} } else await placeArtwork(it); }
  for(const [k,e] of [...shown]){ if(!seen.has(k)){ scene.remove(e.group); shown.delete(k); if(cur&&cur.key===k)closeArt(); } }
  $('hint').textContent=shown.size?T[L].hint:T[L].empty; updatePeople(); }

/* ---------------- movement (height-aware) ---------------- */
const keys={},dpad={f:0,s:0};
addEventListener('keydown',e=>{ const k=e.key.toLowerCase(); keys[k]=true; startAudio(); if(['arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault(); });
addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
document.querySelectorAll('.dpad button').forEach(b=>{ const dir=b.dataset.dir; const set=on=>{ if(dir==='f')dpad.f=on?1:0; if(dir==='b')dpad.f=on?-1:0; if(dir==='l')dpad.s=on?-1:0; if(dir==='r')dpad.s=on?1:0; };
  b.addEventListener('pointerdown',e=>{e.preventDefault();startAudio();navTo=null;set(true);}); ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>set(false))); });
function collideXZ(p){ const lim=W/2-1.0; p.x=clamp(p.x,-lim,lim); p.z=clamp(p.z,-lim,lim);
  const dx=p.x, dz=p.z-3.5, d=Math.hypot(dx,dz); if(d<1.5){ const s=1.5/(d||1e-3); p.x=dx*s; p.z=3.5+dz*s; }   // pedestal
  for(const b of AABBs){ if(p.x>b.x0&&p.x<b.x1&&p.z>b.z0&&p.z<b.z1){ const dl=p.x-b.x0,dr=b.x1-p.x,dt=p.z-b.z0,db=b.z1-p.z,m=Math.min(dl,dr,dt,db); if(m===dl)p.x=b.x0; else if(m===dr)p.x=b.x1; else if(m===dt)p.z=b.z0; else p.z=b.z1; } } }
const fwd=new THREE.Vector3(),rgt=new THREE.Vector3(),upv=new THREE.Vector3(0,1,0),mv=new THREE.Vector3();
function moveStep(dt){ let f=dpad.f,s=dpad.s;
  if(keys['w']||keys['arrowup'])f+=1; if(keys['s']||keys['arrowdown'])f-=1; if(keys['a']||keys['arrowleft'])s-=1; if(keys['d']||keys['arrowright'])s+=1;
  if(f||s){ navTo=null; camera.getWorldDirection(fwd); fwd.y=0; fwd.normalize(); rgt.crossVectors(fwd,upv).normalize(); const sp=4.6*dt;
    const bx=controls.target.x,bz=controls.target.z; controls.target.x+=fwd.x*f*sp+rgt.x*s*sp; controls.target.z+=fwd.z*f*sp+rgt.z*s*sp; collideXZ(controls.target);
    camera.position.x+=controls.target.x-bx; camera.position.z+=controls.target.z-bz; }
  if(navTo){ const dx=navTo.x-controls.target.x,dz=navTo.y-controls.target.z,dist=Math.hypot(dx,dz);
    if(dist<0.25)navTo=null; else { const step=Math.min(dist,5.2*dt),bx=controls.target.x,bz=controls.target.z; controls.target.x+=dx/dist*step; controls.target.z+=dz/dist*step; collideXZ(controls.target); camera.position.x+=controls.target.x-bx; camera.position.z+=controls.target.z-bz; } }
  // vertical: follow floor height
  const gy=groundY(controls.target.x,controls.target.z); const want=gy+1.9; const dY=(want-controls.target.y)*Math.min(1,9*dt);
  controls.target.y+=dY; camera.position.y+=dY; if(camera.position.y<gy+0.6)camera.position.y=gy+0.6;
}

/* ---------------- ambient + SFX ---------------- */
let actx=null,musicOn=true,musicStarted=false,master=null,timers=[];
function startAudio(){ if(musicStarted||!musicOn)return; musicStarted=true;
  try{ actx=new (window.AudioContext||window.webkitAudioContext)(); master=actx.createGain(); master.gain.value=0.16; master.connect(actx.destination);
    const scale=[523.25,587.33,659.25,783.99,880.00],bass=[130.81,146.83,164.81,196.00]; let step=0;
    const beep=(fr,dur,vol,type,delay)=>{ const t=actx.currentTime+(delay||0),o=actx.createOscillator(),g=actx.createGain(); o.type=type||'triangle'; o.frequency.value=fr; g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g).connect(master); o.start(t); o.stop(t+dur+0.05); };
    const tick=()=>{ if(!musicOn||actx.state!=='running')return; const s=step++; const mel=scale[(s*2+(s%3))%scale.length]; beep(mel,0.4,0.09,'triangle'); if(s%2===0)beep(mel*2,0.25,0.025,'sine',0.02); if(s%4===0)beep(bass[(s/4)%bass.length],0.9,0.05,'sine'); };
    tick(); timers.push(setInterval(tick,380)); }catch(e){} }
$('musicBtn').onclick=()=>{ musicOn=!musicOn; $('musicBtn').textContent=musicOn?'🔊':'🔇'; if(musicOn){ if(!musicStarted)startAudio(); else if(master){master.gain.value=0.16; if(actx&&actx.state==='suspended')actx.resume();} } else if(master)master.gain.value=0; };
function sfxPop(){ if(!actx)return; const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain(); o.type='sine'; o.frequency.setValueAtTime(420,t); o.frequency.exponentialRampToValueAtTime(900,t+0.12); g.gain.setValueAtTime(0.2,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.16); o.connect(g).connect(master||actx.destination); o.start(t); o.stop(t+0.2); }
function sfxTwinkle(){ if(!actx)return; [1200,1600,2000].forEach((f,i)=>{ const t=actx.currentTime+i*0.05,o=actx.createOscillator(),g=actx.createGain(); o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(0.12,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.25); o.connect(g).connect(master||actx.destination); o.start(t); o.stop(t+0.3); }); }

  else { item.id=++seq; item.key='L'+item.id; LDATA.items.push(item); saveLocal(); mine.add(item.key); localStorage.setItem('mg_mine',JSON.stringify([...mine])); await syncItems(LDATA.items); openArt(item); } }
async function addComment(txt){ if(!cur||!txt.trim())return; const c={t:txt.trim().slice(0,60),by:(L==='ko'?'친구':'Friend')}; if(backend==='firebase'){ try{await fb.m.updateDoc(fb.m.doc(fb.db,'artworks',cur.key),{comments:fb.m.arrayUnion(c)});}catch(e){} } else { cur.comments=cur.comments||[]; cur.comments.push(c); saveLocal(); refreshModal(); } }
async function addStar(){ if(!cur)return; if(backend==='firebase'){ try{await fb.m.updateDoc(fb.m.doc(fb.db,'artworks',cur.key),{stars:fb.m.increment(1)});}catch(e){} } else { cur.stars=(cur.stars||0)+1; saveLocal(); renderStars(); } burstAt(innerWidth/2,innerHeight*0.4,['⭐','🌟']); }
async function deleteArt(key){ if(!confirm(L==='ko'?'이 작품을 갤러리에서 지울까요?':'Remove this artwork?'))return;
  if(backend==='firebase'){ try{await fb.m.deleteDoc(fb.m.doc(fb.db,'artworks',key));}catch(e){alert('삭제 실패');} }
  else { LDATA.items=LDATA.items.filter(i=>i.key!==key); saveLocal(); const e=shown.get(key); if(e){scene.remove(e.group);shown.delete(key);} }
  mine.delete(key); localStorage.setItem('mg_mine',JSON.stringify([...mine])); closeArt(); if($('adminModal').classList.contains('show'))renderAdmin(); }
// presence (firebase): write my avatar pos, listen to others
let myId=Math.random().toString(36).slice(2), myName=(L==='ko'?'몽글이':'Moong'), lastPres=0;
function startPresence(){ const {m,db,pres}=fb; const col=pres; const myAv=makeAvatar(myName,0xffd45e); // (self not shown)
  m.onSnapshot(col, snap=>{ const now=Date.now(); const live=new Set();
    snap.forEach(d=>{ const x=d.data(); if(d.id===myId)return; if(now-(x.t||0)>15000)return; live.add(d.id);
      if(!others.has(d.id)){ const g=makeAvatar(x.name||'Guest',0x9be36f); scene.add(g); others.set(d.id,{group:g}); } const o=others.get(d.id); o.tx=x.x; o.tz=x.z; });
    for(const [id,o] of [...others]){ if(!live.has(id)){ scene.remove(o.group); others.delete(id); } } updatePeople(); });
  setInterval(async ()=>{ if(!fb)return; const now=Date.now(); if(now-lastPres<1200)return; lastPres=now; try{ await m.setDoc(m.doc(db,'presence',myId),{x:controls.target.x,z:controls.target.z,name:myName,t:now}); }catch(e){} }, 1300);
  addEventListener('beforeunload',()=>{ try{ m.deleteDoc(m.doc(db,'presence',myId)); }catch(e){} });
}
function stepOthers(dt){ for(const [id,o] of others){ if(o.tx===undefined)continue; const dx=o.tx-o.group.position.x,dz=o.tz-o.group.position.z,d=Math.hypot(dx,dz); if(d>0.05){ const s=Math.min(d,3*dt); o.group.position.x+=dx/d*s; o.group.position.z+=dz/d*s; o.group.rotation.y=Math.atan2(dx,dz);} o.group.position.y+=((groundY(o.group.position.x,o.group.position.z))-o.group.position.y)*Math.min(1,6*dt); } }

/* ---------------- upload ---------------- */
$('uploadBtn').onclick=()=>{ startAudio(); $('upModal').classList.add('show'); };
window.closeUp=()=>{ $('upModal').classList.remove('show'); $('preview').classList.add('hide'); pendingImg=null; $('file').value=''; };
$('drop').onclick=()=>$('file').click(); let pendingImg=null;
$('file').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{ const S=760,sc=Math.min(1,S/Math.max(img.width,img.height)); const cv=document.createElement('canvas'); cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc); cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); pendingImg=cv.toDataURL('image/jpeg',0.72); $('preview').src=pendingImg; $('preview').classList.remove('hide'); }; img.src=r.result; }; r.readAsDataURL(f); });
$('submitArt').onclick=async ()=>{ if(!pendingImg){ $('file').click(); return; } const artist=($('artist').value||(L==='ko'?'몽글이':'Moong')).slice(0,20); const title=($('title').value||(L==='ko'?'나의 작품':'My Artwork')).slice(0,30); const award=T[L].awards[Math.floor(Math.random()*T[L].awards.length)]; myName=artist;
  const btn=$('submitArt'); btn.disabled=true; const old=btn.textContent; btn.textContent='…'; try{ await addArtwork({img:pendingImg,artist,title,award,stars:0,comments:[],date:todayStr()}); }catch(e){ alert('업로드 실패'); } btn.disabled=false; btn.textContent=old; $('artist').value=''; $('title').value=''; closeUp(); };
function todayStr(){ const d=new Date(); return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0'); }

/* ---------------- modal + admin ---------------- */
let cur=null;
function openArt(item){ cur=item; refreshModal(); $('delBtn').classList.toggle('hide', !(isAdmin||mine.has(item.key))); $('artModal').classList.add('show'); }
window.closeArt=()=>$('artModal').classList.remove('show');
function refreshModal(){ if(!cur)return; $('aImg').src=cur.img; $('aTitle').textContent=cur.title; $('aArtist').textContent='🎨 '+cur.artist+' · '+(cur.date||''); $('aAward').textContent='🏅 '+(cur.award||''); renderStars(); renderComments(); }
function renderStars(){ $('aStars').textContent='⭐ '+(cur.stars||0)+(L==='ko'?' 개의 응원 별':' cheer stars'); }
function renderComments(){ const box=$('aComments'); box.innerHTML=''; (cur.comments||[]).slice(-40).forEach(c=>{ const d=document.createElement('div'); d.className='cmt'; d.innerHTML='<b>'+esc(c.by||'익명')+'</b> · '+esc(c.t); box.appendChild(d); }); box.scrollTop=box.scrollHeight; }
function buildPresets(){ const p=$('presets'); if(!p)return; p.innerHTML=''; T[L].presets.forEach(txt=>{ const b=document.createElement('button'); b.textContent=txt; b.onclick=()=>addComment(txt); p.appendChild(b); }); }
$('cSend').onclick=()=>{ const v=$('cInput').value; if(v.trim()){ addComment(v); $('cInput').value=''; } };
$('cInput').addEventListener('keydown',e=>{ if(e.key==='Enter')$('cSend').click(); });
$('starBtn').onclick=()=>addStar();
$('delBtn').onclick=()=>{ if(cur)deleteArt(cur.key); };
function esc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
$('adminBtn').onclick=()=>{ if(!isAdmin){ const p=prompt(L==='ko'?'관리자 암호':'Admin password'); if(p!==window.MG_ADMIN_PASS){ if(p!=null)alert(L==='ko'?'암호가 틀려요':'Wrong password'); return; } isAdmin=true; sessionStorage.setItem('mg_admin','1'); } renderAdmin(); $('adminModal').classList.add('show'); };
window.closeAdmin=()=>$('adminModal').classList.remove('show');
function allItems(){ return [...shown.values()].map(e=>e.item); }
function renderAdmin(){ const b=$('adminBody'); const items=allItems(); b.innerHTML='';
  const info=document.createElement('p'); info.className='note'; info.style.textAlign='left'; info.textContent=(L==='ko'?'전시 작품 '+items.length+'개 · 아무 작품이나 지울 수 있어요.':items.length+' artworks · you can remove any.'); b.appendChild(info);
  const list=document.createElement('div'); list.className='admin-list';
  items.forEach(it=>{ const row=document.createElement('div'); row.className='admin-row';
    const im=document.createElement('img'); im.src=it.img; const inf=document.createElement('div'); inf.className='info'; inf.innerHTML='<b>'+esc(it.title)+'</b><small>'+esc(it.artist)+' · '+(it.date||'')+' · ⭐'+(it.stars||0)+'</small>';
    const del=document.createElement('button'); del.className='btn red'; del.textContent='🗑'; del.onclick=()=>deleteArt(it.key);
    const view=document.createElement('button'); view.className='btn ghost'; view.textContent='👁'; view.onclick=()=>{ closeAdmin(); openArt(it); };
    row.append(im,inf,view,del); list.appendChild(row); });
  b.appendChild(list); }

/* ---------------- certificate ---------------- */
$('certBtn').onclick=()=>{ if(cur)makeCertificate(cur); };
function makeCertificate(item){ const cv=document.createElement('canvas'); cv.width=1000; cv.height=720; const c=cv.getContext('2d');
  const g=c.createLinearGradient(0,0,0,720); g.addColorStop(0,'#fffdf7'); g.addColorStop(1,'#fdf3e2'); c.fillStyle=g; c.fillRect(0,0,1000,720);
  c.strokeStyle='#c9a96a'; c.lineWidth=6; c.strokeRect(24,24,952,672); c.strokeStyle='#e6cf9e'; c.lineWidth=2; c.strokeRect(38,38,924,644);
  c.textAlign='center'; c.fillStyle='#a8894c'; c.font='700 22px "Apple SD Gothic Neo",sans-serif'; c.fillText('MONGLEKIDS  METAVERSE  GALLERY',500,92);
  c.fillStyle='#3a2f1a'; c.font='800 44px "Apple SD Gothic Neo",sans-serif'; c.fillText(L==='ko'?'전 시 기 록 증':'CERTIFICATE OF EXHIBITION',500,152);
  const img=new Image(); img.onload=()=>{ const bw=300,ar=img.width/img.height; let w=bw,h=bw; if(ar>1)h=bw/ar; else w=bw*ar; const x=500-w/2,y=200;
    c.save(); c.shadowColor='#0002'; c.shadowBlur=16; c.shadowOffsetY=8; c.fillStyle='#fff'; c.fillRect(x-10,y-10,w+20,h+20); c.restore(); c.strokeStyle='#c9a96a'; c.lineWidth=6; c.strokeRect(x-10,y-10,w+20,h+20); c.drawImage(img,x,y,w,h);
    const by=y+h+52; c.fillStyle='#3a2f1a'; c.font='800 30px "Apple SD Gothic Neo",sans-serif'; c.fillText('“'+item.title+'”',500,by);
    c.fillStyle='#5a4a32'; c.font='500 20px "Apple SD Gothic Neo",sans-serif'; c.fillText((L==='ko'? item.artist+' 어린이의 작품이 몽글 갤러리에 전시되었습니다.':'Exhibited by '+item.artist+' at the Mongle Gallery.'),500,by+40);
    c.fillStyle='#a8894c'; c.font='800 24px "Apple SD Gothic Neo",sans-serif'; c.fillText('🏅 '+(item.award||''),500,by+86);
    c.fillStyle='#8a7a5a'; c.font='500 16px "Apple SD Gothic Neo",sans-serif'; c.fillText((L==='ko'?'응원 별 ':'Cheer stars ')+'⭐ '+(item.stars||0)+'   ·   '+(item.date||''),500,by+120);
    c.fillStyle='#a8894c'; c.font='700 18px "Apple SD Gothic Neo",sans-serif'; c.fillText('Monglekids',500,662);
    const a=document.createElement('a'); a.download='mongle-certificate.png'; a.href=cv.toDataURL('image/png'); a.click(); burstAt(innerWidth/2,innerHeight*0.4,['🎉','🏅','🌟']); }; img.src=item.img; }

/* ---------------- fx ---------------- */
function burstAt(px,py,emo){ for(let i=0;i<20;i++){ const s=document.createElement('div'); s.textContent=emo[i%emo.length]; s.style.cssText='position:fixed;z-index:40;left:'+px+'px;top:'+py+'px;font-size:24px;pointer-events:none;transition:transform 1.1s ease,opacity 1.1s;transform:translate(-50%,-50%)'; document.body.appendChild(s); const ang=Math.random()*6.28,dist=90+Math.random()*160; requestAnimationFrame(()=>{ s.style.transform='translate('+(Math.cos(ang)*dist-50)+'%,'+(Math.sin(ang)*dist+80)+'%) rotate('+(Math.random()*360)+'deg)'; s.style.opacity='0'; }); setTimeout(()=>s.remove(),1150); } }
function ripple(px,py){ const r=document.createElement('div'); r.style.cssText='position:fixed;z-index:39;left:'+px+'px;top:'+py+'px;width:12px;height:12px;border:3px solid #ff9fc4;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);transition:all .5s ease;opacity:.9'; document.body.appendChild(r); requestAnimationFrame(()=>{ r.style.width='70px'; r.style.height='70px'; r.style.opacity='0'; }); setTimeout(()=>r.remove(),520); }

/* ---------------- loop ---------------- */
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
let last=performance.now(),t0=last;
function animate(){ const now=performance.now(),dt=Math.min(0.05,(now-last)/1000); last=now; const t=(now-t0)/1000;
  moveStep(dt); bobFloaties(t); stepNPCs(dt); stepOthers(dt);
  moong.position.y=2.35+Math.sin(t*1.6)*0.05; moong.rotation.y=Math.sin(t*0.5)*0.25 + moongWave*Math.sin(t*20)*0.3; moongWave=Math.max(0,moongWave-dt);
  for(const s of stars){ const k=0.6+0.4*Math.abs(Math.sin(t*1.6+s.userData.ph)); s.scale.set(s.userData.sz*k,s.userData.sz*k,1); s.material.opacity=0.4+0.6*k; }
  controls.update(); renderer.render(scene,camera); requestAnimationFrame(animate); }
initBackend().then(()=>{ $('loading').classList.add('hide'); tr(); animate(); });
</script>
