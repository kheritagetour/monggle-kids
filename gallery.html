<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>몽글 갤러리 · Monglekids Gallery 🖼️</title>
<script>window.MK_LANG=(new URLSearchParams(location.search).get('lang')||localStorage.getItem('mk_lang')||'ko');</script>
<style>
  :root{ --ink:#2b2b3a; --gold:#c9a96a; --gold-d:#a8894c; --teal:#3fc4a8; --pink:#ff6f91; --cream:#fff8f0; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;font-family:"SF Pro Rounded","Apple SD Gothic Neo","Avenir Next",system-ui,sans-serif;color:var(--ink);}
  #c{position:fixed;inset:0;display:block;touch-action:none;}
  .ui{position:fixed;inset:0;pointer-events:none;z-index:5;}
  .ui>*{pointer-events:auto;}
  .topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;
    background:linear-gradient(#000000aa,transparent);}
  .brand{color:#fff;font-weight:800;font-size:16px;text-shadow:0 2px 6px #0007;}
  .brand small{display:block;font-weight:600;font-size:11px;opacity:.85;}
  .tb-btns{display:flex;gap:8px;}
  .btn{border:none;border-radius:999px;padding:10px 16px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;
    background:linear-gradient(135deg,var(--gold),#e0c48a);color:#3a2f1a;box-shadow:0 4px 12px rgba(0,0,0,.25);}
  .btn.ghost{background:#ffffffdd;color:var(--ink);}
  .btn.teal{background:linear-gradient(135deg,var(--teal),#6fce9f);color:#fff;}
  .btn.pink{background:linear-gradient(135deg,var(--pink),#ff9bb0);color:#fff;}
  .btn:active{transform:scale(.96);}
  .hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:#0008;color:#fff;font-size:12px;
    padding:8px 16px;border-radius:999px;backdrop-filter:blur(4px);white-space:nowrap;}
  .modal{position:fixed;inset:0;z-index:20;background:#0009;backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px;}
  .modal.show{display:flex;}
  .sheet{background:var(--cream);border-radius:22px;max-width:440px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 50px #0006;}
  .sheet-pad{padding:20px;}
  .art-big{width:100%;border-radius:14px;display:block;box-shadow:0 8px 20px rgba(0,0,0,.18);background:#fff;}
  .art-meta{margin:12px 2px 4px;}
  .art-title{font-weight:800;font-size:19px;}
  .art-artist{color:#8a83a0;font-size:13px;margin-top:2px;}
  .award{display:inline-block;margin-top:8px;background:#fff3d6;color:var(--gold-d);border:1.5px solid #eBD9a8;
    border-radius:999px;padding:5px 13px;font-weight:800;font-size:12.5px;}
  .stars{margin:10px 0;font-size:14px;font-weight:700;color:var(--gold-d);}
  .cmt-list{margin:8px 0;display:flex;flex-direction:column;gap:7px;max-height:150px;overflow:auto;}
  .cmt{background:#fff;border:1px solid #eee2d4;border-radius:12px;padding:8px 12px;font-size:13.5px;}
  .cmt b{color:var(--teal);}
  .presets{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
  .presets button{border:1.5px solid #e6dccb;background:#fff;border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer;font-family:inherit;}
  .cmt-row{display:flex;gap:8px;margin-top:6px;}
  .cmt-row input{flex:1;border:1.5px solid #e6dccb;border-radius:12px;padding:11px 13px;font-size:14px;font-family:inherit;background:#fff;}
  input.name{width:100%;border:1.5px solid #e6dccb;border-radius:12px;padding:12px 14px;font-size:15px;font-family:inherit;background:#fff;margin-bottom:10px;}
  .row2{display:flex;gap:8px;margin-top:12px;}
  .row2 .btn{flex:1;}
  .close{float:right;border:none;background:#00000012;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;}
  .drop{border:2px dashed #d8c7a8;border-radius:16px;padding:26px;text-align:center;color:#a8956f;background:#fffdf8;cursor:pointer;}
  .drop .big{font-size:40px;display:block;margin-bottom:8px;}
  #file{display:none;}
  .h2{font-weight:800;font-size:20px;margin-bottom:12px;}
  .note{font-size:11px;color:#a89e8e;text-align:center;margin-top:12px;line-height:1.6;}
  .loading{position:fixed;inset:0;z-index:30;background:#1a1424;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;}
  .spin{width:44px;height:44px;border:5px solid #ffffff33;border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg)}}
  .hide{display:none!important;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="loading" id="loading"><div class="spin"></div><div>몽글 갤러리를 여는 중…</div></div>

<div class="ui">
  <div class="topbar">
    <div class="brand">🖼️ 몽글 갤러리<small id="brandSub">Monglekids Virtual Gallery</small></div>
    <div class="tb-btns">
      <button class="btn ghost" id="langBtn">EN</button>
      <button class="btn" id="uploadBtn" data-t="upload">＋ 내 그림 올리기</button>
    </div>
  </div>
  <div class="hint" id="hint" data-t="hint">드래그해서 둘러보고, 그림을 눌러 응원해요 🎨</div>
</div>

<!-- Upload modal -->
<div class="modal" id="upModal">
  <div class="sheet"><div class="sheet-pad">
    <button class="close" onclick="closeUp()">✕</button>
    <div class="h2" data-t="upTitle">🎨 내 그림 전시하기</div>
    <label class="drop" id="drop"><span class="big">🖼️</span><span id="dropTxt" data-t="dropTxt">여기를 눌러 그림 사진을 골라요</span></label>
    <input type="file" id="file" accept="image/*">
    <img id="preview" class="art-big hide" style="margin:12px 0">
    <input class="name" id="artist" data-ph="artist" placeholder="이름 (예: 몽글이)">
    <input class="name" id="title" data-ph="title" placeholder="작품 제목 (예: 우리 가족)">
    <button class="btn teal" id="submitArt" style="width:100%" data-t="submit">✨ 갤러리에 전시하기</button>
    <p class="note" data-t="upNote">사진은 이 브라우저에 저장돼요. 아이 얼굴이 아닌 <b>그림</b>을 올려주세요.</p>
  </div></div>
</div>

<!-- Artwork modal -->
<div class="modal" id="artModal">
  <div class="sheet"><div class="sheet-pad">
    <button class="close" onclick="closeArt()">✕</button>
    <img id="aImg" class="art-big">
    <div class="art-meta">
      <div class="art-title" id="aTitle"></div>
      <div class="art-artist" id="aArtist"></div>
      <div class="award" id="aAward"></div>
    </div>
    <div class="stars" id="aStars"></div>
    <div class="cmt-list" id="aComments"></div>
    <div class="presets" id="presets"></div>
    <div class="cmt-row">
      <input id="cInput" data-ph="cheer" placeholder="응원 한마디 써주기">
      <button class="btn teal" id="cSend">보내기</button>
    </div>
    <div class="row2">
      <button class="btn" id="starBtn">⭐ <span data-t="star">응원 별 주기</span></button>
      <button class="btn pink" id="certBtn" data-t="cert">🏅 전시 기록증</button>
    </div>
  </div></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------- i18n ---------------- */
const T={
 ko:{upload:'＋ 내 그림 올리기',hint:'드래그해서 둘러보고, 그림을 눌러 응원해요 🎨',upTitle:'🎨 내 그림 전시하기',
     dropTxt:'여기를 눌러 그림 사진을 골라요',submit:'✨ 갤러리에 전시하기',
     upNote:'사진은 이 브라우저에 저장돼요. 아이 얼굴이 아닌 <b>그림</b>을 올려주세요.',
     star:'응원 별 주기',cert:'🏅 전시 기록증',brandSub:'Monglekids Virtual Gallery',
     artist:'이름 (예: 몽글이)',title:'작품 제목 (예: 우리 가족)',cheer:'응원 한마디 써주기',
     presets:['멋져요! 🌟','최고예요! 👍','색깔이 예뻐요! 🎨','상상력 대단해요! 🚀','따뜻해요! 💛'],
     awards:['반짝이는 상상력 상','용감한 색깔 상','따뜻한 마음 상','자유로운 생각 상','오늘의 몽글 작가 상','반짝반짝 창의 상'],
     empty:'첫 번째 작품의 주인공이 되어보세요!'},
 en:{upload:'＋ Add my drawing',hint:'Drag to look around, tap a picture to cheer 🎨',upTitle:'🎨 Exhibit my drawing',
     dropTxt:'Tap here to choose a photo of your drawing',submit:'✨ Put it in the gallery',
     upNote:'Photos are saved in this browser. Please upload the <b>drawing</b>, not a child\'s face.',
     star:'Give a star',cert:'🏅 Certificate',brandSub:'Monglekids Virtual Gallery',
     artist:'Name (e.g., Moong)',title:'Title (e.g., My Family)',cheer:'Write a cheer',
     presets:['Awesome! 🌟','You rock! 👍','Lovely colors! 🎨','So creative! 🚀','So warm! 💛'],
     awards:['Sparkling Imagination Award','Brave Colors Award','Warm Heart Award','Free Thinker Award','Today\'s Mongle Artist','Twinkle Creativity Award'],
     empty:'Be the very first artist here!'}
};
let L=(window.MK_LANG==='en')?'en':'ko';
function tr(){ const d=T[L];
  document.querySelectorAll('[data-t]').forEach(e=>{const k=e.getAttribute('data-t'); if(d[k]!=null)e.innerHTML=d[k];});
  document.querySelectorAll('[data-ph]').forEach(e=>{const k=e.getAttribute('data-ph'); if(d[k]!=null)e.placeholder=d[k];});
  document.getElementById('langBtn').textContent=(L==='ko')?'EN':'한국어';
  document.documentElement.lang=L;
  buildPresets();
}
document.getElementById('langBtn').onclick=()=>{ L=(L==='ko')?'en':'ko'; window.MK_LANG=L; localStorage.setItem('mk_lang',L); tr(); };

/* ---------------- persistence (localStorage; never resets on reload) ---------------- */
const KEY='mg_gallery_v2';
function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||{items:[]}; }catch(e){ return {items:[]}; } }
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(DATA)); }catch(e){ alert('저장 공간이 가득 찼어요. 오래된 작품을 정리해 주세요.'); } }
let DATA=load();
let seq = DATA.items.reduce((m,i)=>Math.max(m,i.id||0),0);

/* ---------------- three.js scene ---------------- */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
scene.background=new THREE.Color('#efe6d6');
scene.fog=new THREE.Fog('#efe6d6', 22, 46);
const camera=new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 2.6, 9);
const controls=new OrbitControls(camera, canvas);
controls.target.set(0, 2.2, 0);
controls.enablePan=false; controls.enableDamping=true; controls.dampingFactor=.08;
controls.minDistance=3; controls.maxDistance=13.5;
controls.minPolarAngle=0.7; controls.maxPolarAngle=1.5;

/* lights */
scene.add(new THREE.HemisphereLight(0xffffff, 0xb8a888, 0.9));
const key=new THREE.DirectionalLight(0xfff4e0, 0.5); key.position.set(6,10,6); scene.add(key);
[[-6,-6],[6,-6],[-6,6],[6,6]].forEach(([x,z])=>{ const p=new THREE.PointLight(0xfff0d8,0.35,26); p.position.set(x,5.2,z); scene.add(p); });

/* room */
const W=18, D=18, H=6;
const floorMat=new THREE.MeshStandardMaterial({color:0xd8c6a6, roughness:.9});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(W,D), floorMat); floor.rotation.x=-Math.PI/2; scene.add(floor);
// subtle floor grid
const gridh=new THREE.GridHelper(W, 9, 0xc2ad86, 0xc9b892); gridh.position.y=0.01; scene.add(gridh);
const wallMat=new THREE.MeshStandardMaterial({color:0xf3ebdc, roughness:1, side:THREE.DoubleSide});
function wall(w,h,x,y,z,ry){ const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h), wallMat); m.position.set(x,y,z); m.rotation.y=ry; scene.add(m); }
wall(W,H, 0,H/2,-D/2, 0); wall(W,H, 0,H/2,D/2, Math.PI);
wall(D,H, -W/2,H/2,0, Math.PI/2); wall(D,H, W/2,H/2,0, -Math.PI/2);
const ceil=new THREE.Mesh(new THREE.PlaneGeometry(W,D), new THREE.MeshStandardMaterial({color:0xfbf6ec})); ceil.rotation.x=Math.PI/2; ceil.position.y=H; scene.add(ceil);
// a soft carpet
const rug=new THREE.Mesh(new THREE.CircleGeometry(4.4,48), new THREE.MeshStandardMaterial({color:0xe7d3b6,roughness:1})); rug.rotation.x=-Math.PI/2; rug.position.y=0.02; scene.add(rug);

/* Moong avatar (billboard sprite) */
let avatar=null;
new THREE.TextureLoader().load('assets/book/moong.png', t=>{
  t.colorSpace=THREE.SRGBColorSpace;
  const m=new THREE.SpriteMaterial({map:t, transparent:true});
  avatar=new THREE.Sprite(m); avatar.scale.set(2.1,2.1,1); avatar.position.set(0,1.35,0); scene.add(avatar);
}, undefined, ()=>{ /* fallback: simple avatar */
  const g=new THREE.Group();
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.55,24,24), new THREE.MeshStandardMaterial({color:0xffffff}));
  head.position.y=1.7; const body=new THREE.Mesh(new THREE.CapsuleGeometry(0.5,0.7,8,16), new THREE.MeshStandardMaterial({color:0xbfe3ff}));
  body.position.y=0.9; g.add(head); g.add(body); scene.add(g); avatar=g;
});

/* ---------------- artworks ---------------- */
const slots=(function(){
  const s=[], y=2.35, inset=2.6, near=0.12;
  const run=(n,sx,sz,ex,ez,ry)=>{ for(let i=0;i<n;i++){ const t=(i+0.5)/n; s.push({x:sx+(ex-sx)*t, y, z:sz+(ez-sz)*t, ry}); } };
  run(5, -W/2+inset,-D/2+near, W/2-inset,-D/2+near, 0);
  run(5, W/2-near,-D/2+inset, W/2-near,D/2-inset, -Math.PI/2);
  run(5, W/2-inset,D/2-near, -W/2+inset,D/2-near, Math.PI);
  run(5, -W/2+near,D/2-inset, -W/2+near,-D/2+inset, Math.PI/2);
  return s;
})();
const artMeshes=[]; // {mesh, item}
function placeArtwork(item, idx){
  return new Promise(res=>{
    const slot=slots[idx % slots.length];
    const yoff=Math.floor(idx/slots.length)*0; // (single ring)
    const img=new Image();
    img.onload=()=>{
      const ar=img.width/img.height; let w=2.2,h=2.2; if(ar>1)h=w/ar; else w=h*ar;
      const tex=new THREE.Texture(img); tex.colorSpace=THREE.SRGBColorSpace; tex.needsUpdate=true;
      const grp=new THREE.Group();
      const frame=new THREE.Mesh(new THREE.BoxGeometry(w+0.34,h+0.34,0.12), new THREE.MeshStandardMaterial({color:0xc9a96a,roughness:.55,metalness:.35}));
      const mat=new THREE.Mesh(new THREE.PlaneGeometry(w+0.12,h+0.12), new THREE.MeshStandardMaterial({color:0xffffff}));
      mat.position.z=0.062;
      const art=new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshBasicMaterial({map:tex}));
      art.position.z=0.07; art.userData.item=item;
      // name plate
      grp.add(frame); grp.add(mat); grp.add(art);
      grp.position.set(slot.x, slot.y+yoff, slot.z); grp.rotation.y=slot.ry;
      scene.add(grp);
      artMeshes.push({mesh:art, item});
      res();
    };
    img.src=item.img;
  });
}
async function buildGallery(){
  artMeshes.length=0;
  for(let i=0;i<DATA.items.length;i++){ await placeArtwork(DATA.items[i], i); }
  document.getElementById('hint').textContent = DATA.items.length? T[L].hint : T[L].empty;
}

/* raycast click on artwork */
const ray=new THREE.Raycaster(), ptr=new THREE.Vector2();
let downXY=null;
canvas.addEventListener('pointerdown', e=>{ downXY=[e.clientX,e.clientY]; });
canvas.addEventListener('pointerup', e=>{
  if(!downXY) return; const dx=e.clientX-downXY[0], dy=e.clientY-downXY[1]; downXY=null;
  if(Math.hypot(dx,dy)>8) return; // was a drag
  ptr.x=(e.clientX/innerWidth)*2-1; ptr.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(ptr, camera);
  const hits=ray.intersectObjects(artMeshes.map(a=>a.mesh));
  if(hits.length) openArt(hits[0].object.userData.item);
});

/* resize + animate */
addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
renderer.setSize(innerWidth,innerHeight);
let t0=performance.now();
function animate(){
  const t=(performance.now()-t0)/1000;
  if(avatar){ avatar.position.y=1.35+Math.sin(t*2)*0.06; }
  controls.update(); renderer.render(scene,camera); requestAnimationFrame(animate);
}
buildGallery().then(()=>{ document.getElementById('loading').classList.add('hide'); animate(); });

/* ---------------- UI: upload ---------------- */
const $=id=>document.getElementById(id);
$('uploadBtn').onclick=()=>{ $('upModal').classList.add('show'); };
window.closeUp=()=>{ $('upModal').classList.remove('show'); $('preview').classList.add('hide'); pendingImg=null; $('file').value=''; };
$('drop').onclick=()=>$('file').click();
let pendingImg=null;
$('file').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ const img=new Image(); img.onload=()=>{
    // resize to max 720px, jpeg to keep storage small
    const S=720, sc=Math.min(1,S/Math.max(img.width,img.height));
    const cv=document.createElement('canvas'); cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    pendingImg=cv.toDataURL('image/jpeg',0.72);
    $('preview').src=pendingImg; $('preview').classList.remove('hide');
  }; img.src=r.result; };
  r.readAsDataURL(f);
});
$('submitArt').onclick=async ()=>{
  if(!pendingImg){ $('file').click(); return; }
  const artist=($('artist').value||(L==='ko'?'몽글이':'Moong')).slice(0,20);
  const title=($('title').value||(L==='ko'?'나의 작품':'My Artwork')).slice(0,30);
  const award=T[L].awards[Math.floor(rnd()*T[L].awards.length)];
  const item={ id:++seq, img:pendingImg, artist, title, award, stars:0, comments:[], date:todayStr() };
  DATA.items.push(item); persist();
  await placeArtwork(item, DATA.items.length-1);
  closeUp(); openArt(item); // show its certificate-ready modal
  $('artist').value=''; $('title').value='';
};
function rnd(){ // deterministic-ish without Date.now in scripts elsewhere; here fine
  return Math.random();
}
function todayStr(){ const d=new Date(); return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0'); }

/* ---------------- UI: artwork detail + comments ---------------- */
let cur=null;
function openArt(item){
  cur=item; $('aImg').src=item.img; $('aTitle').textContent=item.title; $('aArtist').textContent='🎨 '+item.artist+' · '+(item.date||'');
  $('aAward').textContent='🏅 '+(item.award||'');
  renderStars(); renderComments(); $('artModal').classList.add('show');
}
window.closeArt=()=>$('artModal').classList.remove('show');
function renderStars(){ $('aStars').textContent='⭐ '+(cur.stars||0)+(L==='ko'?' 개의 응원 별':' cheer stars'); }
function renderComments(){
  const box=$('aComments'); box.innerHTML='';
  (cur.comments||[]).slice(-30).forEach(c=>{ const d=document.createElement('div'); d.className='cmt';
    d.innerHTML='<b>'+esc(c.by||'익명')+'</b> · '+esc(c.t); box.appendChild(d); });
  box.scrollTop=box.scrollHeight;
}
function buildPresets(){
  const p=$('presets'); if(!p) return; p.innerHTML='';
  T[L].presets.forEach(txt=>{ const b=document.createElement('button'); b.textContent=txt; b.onclick=()=>addComment(txt); p.appendChild(b); });
}
function addComment(txt){
  if(!cur||!txt.trim()) return;
  cur.comments=cur.comments||[]; cur.comments.push({t:txt.trim().slice(0,60), by:(L==='ko'?'친구':'Friend')});
  persist(); renderComments();
}
$('cSend').onclick=()=>{ const v=$('cInput').value; if(v.trim()){ addComment(v); $('cInput').value=''; } };
$('cInput').addEventListener('keydown',e=>{ if(e.key==='Enter'){ $('cSend').click(); } });
$('starBtn').onclick=()=>{ if(!cur) return; cur.stars=(cur.stars||0)+1; persist(); renderStars(); burst(); };
function esc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

/* ---------------- certificate (전시 기록증 + 상장) ---------------- */
$('certBtn').onclick=()=>{ if(cur) makeCertificate(cur); };
function makeCertificate(item){
  const cv=document.createElement('canvas'); cv.width=1000; cv.height=720; const c=cv.getContext('2d');
  // bg
  const g=c.createLinearGradient(0,0,0,720); g.addColorStop(0,'#fffdf7'); g.addColorStop(1,'#fdf3e2'); c.fillStyle=g; c.fillRect(0,0,1000,720);
  c.strokeStyle='#c9a96a'; c.lineWidth=6; c.strokeRect(24,24,952,672);
  c.strokeStyle='#e6cf9e'; c.lineWidth=2; c.strokeRect(38,38,924,644);
  c.textAlign='center'; c.fillStyle='#a8894c';
  c.font='700 22px "Apple SD Gothic Neo",sans-serif'; c.fillText('MONGLEKIDS  VIRTUAL  GALLERY', 500, 92);
  c.fillStyle='#3a2f1a'; c.font='800 44px "Apple SD Gothic Neo",sans-serif';
  c.fillText(L==='ko'?'전 시 기 록 증':'CERTIFICATE OF EXHIBITION', 500, 152);
  // artwork thumbnail
  const img=new Image(); img.onload=()=>{
    const bw=300, ar=img.width/img.height; let w=bw,h=bw; if(ar>1)h=bw/ar; else w=bw*ar;
    const x=500-w/2, y=200;
    c.save(); c.shadowColor='#0002'; c.shadowBlur=16; c.shadowOffsetY=8; c.fillStyle='#fff'; c.fillRect(x-10,y-10,w+20,h+20); c.restore();
    c.strokeStyle='#c9a96a'; c.lineWidth=6; c.strokeRect(x-10,y-10,w+20,h+20);
    c.drawImage(img, x,y,w,h);
    const by=y+h+52;
    c.fillStyle='#3a2f1a'; c.font='800 30px "Apple SD Gothic Neo",sans-serif';
    c.fillText('“'+item.title+'”', 500, by);
    c.fillStyle='#5a4a32'; c.font='500 20px "Apple SD Gothic Neo",sans-serif';
    c.fillText((L==='ko'? item.artist+' 어린이의 작품이 몽글 갤러리에 전시되었습니다.' : 'Exhibited by '+item.artist+' at the Mongle Gallery.'), 500, by+40);
    // award ribbon
    c.fillStyle='#a8894c'; c.font='800 24px "Apple SD Gothic Neo",sans-serif';
    c.fillText('🏅 '+(item.award||''), 500, by+86);
    c.fillStyle='#8a7a5a'; c.font='500 16px "Apple SD Gothic Neo",sans-serif';
    c.fillText((L==='ko'?'응원 별 ':'Cheer stars ')+'⭐ '+(item.stars||0)+'   ·   '+(item.date||''), 500, by+120);
    c.fillStyle='#a8894c'; c.font='700 18px "Apple SD Gothic Neo",sans-serif';
    c.fillText('Monglekids', 500, 662);
    // download
    const a=document.createElement('a'); a.download='mongle-certificate.png'; a.href=cv.toDataURL('image/png'); a.click();
    burst();
  };
  img.src=item.img;
}

/* confetti burst */
function burst(){
  for(let i=0;i<24;i++){ const s=document.createElement('div');
    s.textContent=['🌟','🎉','💛','✨','🏅'][i%5]; s.style.cssText='position:fixed;z-index:40;left:50%;top:40%;font-size:22px;pointer-events:none;transition:transform 1.1s ease,opacity 1.1s';
    document.body.appendChild(s); const ang=Math.random()*6.28, dist=120+Math.random()*180;
    requestAnimationFrame(()=>{ s.style.transform='translate('+Math.cos(ang)*dist+'px,'+(Math.sin(ang)*dist+120)+'px) rotate('+(Math.random()*360)+'deg)'; s.style.opacity='0'; });
    setTimeout(()=>s.remove(),1150);
  }
}

tr();
</script>
